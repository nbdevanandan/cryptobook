{% if toc %}
<aside class="toc-sidebar" id="toc-sidebar">
  <h2 class="sr-only">On this page</h2>
  <ol>
  {% for h in toc %}
    <li><a href="#{{ h.id }}">{{ h.title }}</a>
    {% if h.children %}<ol>{% for c in h.children %}<li><a href="#{{ c.id }}">{{ c.title }}</a></li>{% endfor %}</ol>{% endif %}
    </li>
  {% endfor %}
  </ol>
</aside>
{% endif %}
